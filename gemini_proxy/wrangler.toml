name = "awaqat-gemini-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"

# حد استهلاك CPU قليل جداً — التطبيق يبقى داخل الخطة المجانية
[limits]
cpu_ms = 50

[observability]
enabled = true

# ★ ضع المفاتيح بأمان عبر أوامر سرية، وليس في هذا الملف:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put APP_SECRET
