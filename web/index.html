<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="أوقات الصلاة والأذان في ليبيا — مواقيت دقيقة، قبلة، أذكار، ومكتبة إسلامية.">

  <!-- iOS: تشغيل ملء الشاشة بلا شريط سفاري عند الإضافة إلى الشاشة الرئيسية -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- هذا هو الاسم الذي يظهر تحت الأيقونة على شاشة الآيفون -->
  <meta name="apple-mobile-web-app-title" content="أوقات الصلاة">
  <meta name="theme-color" content="#0A0A1E">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-180.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>أوقات الصلاة — مؤذن ليبيا</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* خلفية بلون العلامة قبل إقلاع Flutter — تمنع الوميض الأبيض المزعج */
    html, body {
      margin: 0;
      padding: 0;
      background: #0A0A1E;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    }
    /* شاشة انتظار بسيطة: يُغطّيها التطبيق عند أول إطار ثم تُزال */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #0A0A1E;
    }
    #boot img {
      width: 132px;
      height: 132px;
      border-radius: 28px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    #boot p {
      margin: 0;
      font-size: 15px;
      color: rgba(255, 255, 255, 0.75);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }
  </style>
</head>
<body>
  <div id="boot">
    <img src="icons/Icon-192.png" alt="أوقات الصلاة">
    <p>جارٍ التحميل…</p>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // إزالة شاشة الانتظار عند أول إطار يرسمه Flutter (ومهلة احتياطية).
    function hideBoot() {
      var el = document.getElementById('boot');
      if (el) el.remove();
    }
    window.addEventListener('flutter-first-frame', hideBoot);
    setTimeout(hideBoot, 30000);
  </script>
</body>
</html>
